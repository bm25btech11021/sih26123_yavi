# M9-V2 Congested Warehouse Grid Configuration (32m x 32m, 24 Storage Racks)
map_id: "warehouse_m9_v2"
dimensions:
  x: 32.0
  y: 32.0
resolution: 0.5

perimeter_walls:
  thickness: 0.4
  height: 2.5

